<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">Internet Memory mock screenshot placeholder</title>
  <desc id="description">A fictional placeholder illustrating where a public post screenshot will appear. Not a real post.</desc>
  <rect width="1200" height="760" fill="#f4f7f8" />
  <rect x="90" y="70" width="1020" height="620" rx="24" fill="#ffffff" stroke="#d9e1e5" stroke-width="3" />
  <circle cx="170" cy="160" r="36" fill="#dce9ed" />
  <text x="170" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#265568">IM</text>
  <text x="230" y="154" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#17212b">演示内容</text>
  <text x="230" y="190" font-family="Arial, sans-serif" font-size="22" fill="#61717b">@demo · mock 记录</text>
  <text x="150" y="285" font-family="Arial, sans-serif" font-size="30" fill="#344550">这张图片仅用于展示记录页面的截图区域。</text>
  <text x="150" y="335" font-family="Arial, sans-serif" font-size="30" fill="#344550">它不对应真实账号、帖子或事件。</text>
  <line x1="150" y1="405" x2="1050" y2="405" stroke="#e5ebee" stroke-width="2" />
  <rect x="150" y="460" width="900" height="110" rx="14" fill="#edf4f6" />
  <text x="600" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#356170">DEMO · NOT A REAL POST</text>
  <text x="600" y="548" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#61717b">Mock asset only — not an uploaded attachment</text>
</svg>
